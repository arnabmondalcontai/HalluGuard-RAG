# NLI Detector Configuration
# ==========================
# Focused NLI detector with DeBERTa v3

experiment_name: nli_detector_only
retriever:
  type: hybrid
  top_k: 5
  dense_model: sentence-transformers/all-MiniLM-L6-v2
  bm25_weight: 0.3
  dense_weight: 0.7
generator:
  model: llama3-8b-8192
  temperature: 0.1
  max_tokens: 512
detector:
  type: nli_only
  model: cross-encoder/nli-deberta-v3-base
  threshold: 0.5
  batch_size: 8
mitigation:
  enabled: true
  strategy: self_reflection
  max_iterations: 3
evaluation:
  datasets: [halueval, truthfulqa]
  n_samples: 500
  metrics: [faithfulness, auroc, f1, latency]
