# Ensemble Detector Configuration
# ================================
# Full ensemble: NLI + Embedding + LLM Judge

experiment_name: ensemble_detector
retriever:
  type: hybrid
  top_k: 5
  dense_model: sentence-transformers/all-MiniLM-L6-v2
  bm25_weight: 0.3
  dense_weight: 0.7
generator:
  model: llama3-8b-8192
  temperature: 0.1
  max_tokens: 512
detector:
  type: ensemble
  weights:
    nli: 0.5
    embedding: 0.2
    llm_judge: 0.3
  nli_model: cross-encoder/nli-deberta-v3-base
  embedding_model: sentence-transformers/all-mpnet-base-v2
  llm_judge_model: llama3-8b-8192
  threshold: 0.5
  batch_size: 8
mitigation:
  enabled: true
  strategy: self_reflection
  max_iterations: 3
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  reranker_top_k: 3
evaluation:
  datasets: [halueval, truthfulqa]
  n_samples: 500
  metrics: [faithfulness, auroc, f1, latency]
  ablation: true
